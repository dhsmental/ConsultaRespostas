<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso de Direitos Humanos e Saúde Mental - Trilhas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
      background: #f7f8fa;
      color: #222;
    }
    .banner-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .banner-box img {
      display: block;
      width: 100%;
      height: auto;
    }
    .instrucao {
      margin: 0 0 14px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #222;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 16px;
    }
    .busca-box {
      display: flex;
      gap: 10px;
    }
    input[type="email"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #2e6b3e;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #235330;
    }
    .meta {
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .trilha-item {
      border-top: 1px solid #eee;
      padding: 12px 0;
    }
    .trilha-titulo {
      font-weight: bold;
      color: #2e6b3e;
      margin-bottom: 4px;
    }
    .sem-resposta {
      color: #777;
      font-style: italic;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    #statusMsg {
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="banner-box">
    <img src="banner.jpg" alt="Educação em Direitos Humanos e Saúde Mental - UNIPAMPA">
  </div>

  <div class="card">
    <p class="instrucao">
      Insira seu e-mail cadastrado no Curso de Direitos Humanos e Saúde Mental, para ter acesso as suas respostas das Trilhas do curso.
    </p>
    <div class="busca-box">
      <input type="email" id="emailInput" placeholder="Digite seu e-mail cadastrado..." required>
      <button onclick="buscarEmail()">Consultar</button>
    </div>
    <div id="aviso" style="margin-top: 12px;"></div>
  </div>

  <div id="painelResultado" class="card" style="display: none;">
    <div id="dadosCursista" class="meta"></div>
    <h3>Respostas nas Trilhas</h3>
    <div id="listaTrilhas"></div>

    <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 16px;">
      <label for="campoMensagem"><strong>Adicionar nova observação ou mensagem:</strong></label>
      <textarea id="campoMensagem" rows="4" placeholder="Digite aqui caso queira registrar algo..."></textarea>
      <button onclick="salvarMensagem()">Salvar mensagem</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwo-UrZJZCJwoodjO7q7rPCEsJuI2THyLg4DheLEv2FEQCFKqqL6sFfTRVRRsUxM18P/exec';

    async function buscarEmail() {
      const email = document.getElementById('emailInput').value.trim();
      const aviso = document.getElementById('aviso');
      const painel = document.getElementById('painelResultado');

      if (!email) {
        aviso.innerHTML = '<span style="color:#b00020;">Informe um e-mail para buscar.</span>';
        return;
      }

      aviso.textContent = 'Buscando na planilha...';
      painel.style.display = 'none';
      document.getElementById('statusMsg').textContent = '';

      try {
        const resp = await fetch(`${URL_SCRIPT}?email=${encodeURIComponent(email)}`);
        const data = await resp.json();

        if (!data.encontrado) {
          aviso.innerHTML = '<span style="color:#b00020;">E-mail não encontrado na aba Respostas.</span>';
          return;
        }

        aviso.textContent = '';
        painel.style.display = 'block';

        document.getElementById('dadosCursista').innerHTML = `
          <div><strong>Cursista:</strong> ${escaparHtml(data.cursista)}</div>
          <div><strong>Tutor:</strong> ${escaparHtml(data.tutor)}</div>
        `;

        const listaTrilhas = document.getElementById('listaTrilhas');
        listaTrilhas.innerHTML = data.trilhas.map(item => `
          <div class="trilha-item">
            <div class="trilha-titulo">${escaparHtml(item.titulo)}</div>
            <div>${item.resposta
              ? escaparHtml(item.resposta).replace(/\n/g, '<br>')
              : '<span class="sem-resposta">Sem resposta registrada</span>'}</div>
          </div>
        `).join('');

        document.getElementById('campoMensagem').value = '';
      } catch (err) {
        console.error(err);
        aviso.innerHTML = '<span style="color:#b00020;">Erro ao consultar os dados.</span>';
      }
    }

    async function salvarMensagem() {
      const email = document.getElementById('emailInput').value.trim();
      const campo = document.getElementById('campoMensagem');
      const mensagem = campo.value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!mensagem) {
        statusMsg.style.color = '#b00020';
        statusMsg.textContent = 'Digite uma mensagem antes de salvar.';
        return;
      }

      statusMsg.style.color = '#333';
      statusMsg.textContent = 'Salvando...';

      try {
        const resp = await fetch(URL_SCRIPT, {
          method: 'POST',
          body: JSON.stringify({ email, mensagem })
        });
        const data = await resp.json();

        if (data.sucesso) {
          campo.value = '';
          statusMsg.style.color = '#2e6b3e';
          statusMsg.textContent = 'Mensagem salva';
        } else {
          statusMsg.style.color = '#b00020';
          statusMsg.textContent = 'Não foi possível salvar a mensagem.';
        }
      } catch (err) {
        console.error(err);
        statusMsg.style.color = '#b00020';
        statusMsg.textContent = 'Erro de conexão ao salvar.';
      }
    }

    function escaparHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
